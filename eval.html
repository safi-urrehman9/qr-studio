<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Labeler Eval</title>
<style>body{font:14px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#fff;color:#161a22}
@media (prefers-color-scheme:dark){body{background:#0e1015;color:#e7e9ee}} td{padding:2px 10px 2px 0} .x{color:#c92a4b}</style></head>
<body>
<h1>Field-naming accuracy</h1>
<p>Each value is labelled on its own (no help from other fields). Set A was used for tuning; set B is held out.</p>
<div id="out">Running…</div>
<script type="module">
import { load, suggest } from './assets/labeler.js';
import { SET_A, SET_B } from './eval_sets.js';
const t0 = performance.now(); await load('./'); const loadMs = performance.now() - t0;
let html = `<p>Model load: ${Math.round(loadMs)} ms</p>`;
window.results = { loadMs };
for (const [name, set] of [['A (tuning)', SET_A], ['B (held out)', SET_B]]) {
  const t1 = performance.now(); let right = 0, byRule = 0, ruleRight = 0; const rows = [];
  for (const [value, want] of set) {
    const [s] = await suggest([{ key: '', value }], false);
    const ok = s?.label === want; right += ok;
    if (s?.how === 'rule') { byRule++; ruleRight += ok; }
    rows.push(`<tr class="${ok ? '' : 'x'}"><td>${ok ? '✓' : '✗'}</td><td>${value}</td><td>${s?.label ?? '—'} <small>(${s?.how ?? ''} ${s ? s.score.toFixed(2) : ''})</small></td><td>${ok ? '' : 'want ' + want}</td></tr>`);
  }
  const ms = (performance.now() - t1) / set.length;
  window.results[name] = { right, n: set.length, byRule, ruleRight, msPerField: ms };
  html += `<h2>Set ${name}: ${right}/${set.length} = ${Math.round(100 * right / set.length)}%</h2>
    <p>${byRule} decided by rules (${ruleRight} correct), ${set.length - byRule} by the model (${right - ruleRight} correct) · ${ms.toFixed(1)} ms/field</p><table>${rows.join('')}</table>`;
}
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
